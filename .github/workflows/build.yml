name: Build deb
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Cache Theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-roothide-macos14-v1
      - name: Cache sdks
        uses: actions/cache@v4
        with:
          path: ~/sdks
          key: sdks-macos14-v1
      - name: Install tools
        run: brew install ldid dpkg make xz || brew upgrade ldid dpkg || true
      - name: Setup Roothide Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then git clone --recursive https://github.com/roothide/theos "$HOME/theos"; fi
          if [ ! -d "$HOME/sdks" ]; then git clone --depth 1 https://github.com/theos/sdks "$HOME/sdks"; fi
          mkdir -p "$HOME/theos/sdks"
          cp -Rn "$HOME/sdks/"*.sdk "$HOME/theos/sdks/" 2>/dev/null || true
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: gmake package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: MotionSpoofer-deb
          path: packages/*.deb
