name: Build deb
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ldid dpkg make xz
      - name: Get roothide Theos and SDKs
        run: |
          git clone --recursive https://github.com/roothide/theos "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks "$HOME/sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME"/sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      - name: Build
        run: gmake package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: MotionSpoofer-deb
          path: packages/*.deb
