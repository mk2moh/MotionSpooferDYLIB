name: Build deb
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Roothide Theos
        run: |
          rm -rf /opt/theos
          git clone --recursive https://github.com/roothide/theos /opt/theos
          git clone --depth 1 https://github.com/theos/sdks /tmp/sdks
          mkdir -p /opt/theos/sdks
          cp -R /tmp/sdks/*.sdk /opt/theos/sdks/ || true
      - name: Build
        run: gmake package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: MotionSpoofer-deb
          path: packages/*.deb
